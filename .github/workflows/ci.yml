name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers sobe o PostgreSQL 18 efêmero usando o Docker do runner.
      - name: Suíte completa de testes
        run: ./mvnw --batch-mode test

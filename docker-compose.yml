services:
  db:
    image: postgres:18
    container_name: hotelimpact-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotelimpact
      POSTGRES_PASSWORD: hotelimpact_dev
      POSTGRES_DB: hotelimpact
    ports:
      # 5433 no host para não conflitar com outros PostgreSQL locais.
      - "5433:5432"
    volumes:
      # postgres:18 exige o mount em /var/lib/postgresql (não em .../data),
      # para dar suporte ao pg_upgrade entre versões.
      - hotelimpact_pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelimpact -d hotelimpact"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hotelimpact_pgdata:

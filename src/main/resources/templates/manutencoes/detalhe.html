<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/fragments :: head(${titulo})}"></head>
<body>
<a th:replace="~{layout/fragments :: pular-para-conteudo}"></a>
<div class="app-wrapper">

    <aside th:replace="~{layout/fragments :: sidebar('manutencao')}"></aside>

    <div class="app-main">
        <header th:replace="~{layout/fragments :: topbar}"></header>

        <main class="app-content" id="conteudoPrincipal">
            <div th:replace="~{layout/fragments :: mensagens}"></div>

            <div class="d-flex align-items-center gap-2 mb-4">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/manutencoes}" title="Voltar">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h1 class="h3 page-title mb-0" th:text="${titulo}">Detalhes da ordem</h1>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-7">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
                                <i class="bi bi-tools display-5 text-secondary"></i>
                                <div>
                                    <h2 class="h4 mb-1" th:text="${ordem.titulo}">Ar condicionado vazando</h2>
                                    <span th:replace="~{layout/fragments :: badge-estado-manutencao(${ordem.estado})}">ABERTA</span>
                                    <span class="ms-1" th:replace="~{layout/fragments :: badge-prioridade-manutencao(${ordem.prioridade})}">MEDIA</span>
                                    <span class="badge badge-estado-erro ms-1"
                                          th:if="${ordem.interditouQuarto}">quarto interditado</span>
                                </div>
                            </div>

                            <dl class="row mb-0">
                                <dt class="col-sm-4">Quarto</dt>
                                <dd class="col-sm-8" th:text="${ordem.quartoNumero}">101</dd>

                                <dt class="col-sm-4">Aberta em</dt>
                                <dd class="col-sm-8" th:text="${ordem.abertaEm} ?: '—'">23/10/2026 14:00</dd>

                                <dt class="col-sm-4">Concluída em</dt>
                                <dd class="col-sm-8" th:text="${ordem.concluidaEm} ?: '—'">—</dd>

                                <dt class="col-sm-4">Descrição</dt>
                                <dd class="col-sm-8" th:text="${ordem.descricao} ?: '—'">—</dd>

                                <dt class="col-sm-4">Observações</dt>
                                <dd class="col-sm-8" th:text="${ordem.observacoes} ?: '—'">—</dd>
                            </dl>
                        </div>
                        <div class="card-footer bg-transparent d-flex gap-2 flex-wrap">
                            <form th:if="${ordem.podeIniciar}" method="post"
                                  th:action="@{'/manutencoes/' + ${ordem.id} + '/iniciar'}">
                                <button type="submit" class="btn btn-outline-primary btn-sm">
                                    <i class="bi bi-play-circle me-1"></i>Iniciar execução
                                </button>
                            </form>
                            <form th:if="${ordem.podeConcluirOuCancelar}" method="post"
                                  th:action="@{'/manutencoes/' + ${ordem.id} + '/concluir'}">
                                <button type="submit" class="btn btn-outline-success btn-sm">
                                    <i class="bi bi-check-lg me-1"></i>Concluir
                                </button>
                            </form>
                            <form th:if="${ordem.podeConcluirOuCancelar}" method="post"
                                  th:action="@{'/manutencoes/' + ${ordem.id} + '/cancelar'}"
                                  th:attr="data-confirmar='Cancelar a ordem de manutenção do quarto ' + ${ordem.quartoNumero} + '? O quarto será liberado quando aplicável.'">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-x-lg me-1"></i>Cancelar ordem
                                </button>
                            </form>
                            <a class="btn btn-outline-secondary btn-sm" th:href="@{/manutencoes}">
                                <i class="bi bi-list me-1"></i>Voltar à listagem
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</div>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>

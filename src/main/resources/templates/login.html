<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/fragments :: head(${titulo})}"></head>
<body class="bg-body-tertiary d-flex align-items-center" style="min-height: 100vh;">
<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-building-fill fs-1 text-secondary"></i>
                <h1 class="h4 mt-2 mb-0">HotelImpact</h1>
                <span class="text-secondary small">Gestão hoteleira · Recepção</span>
            </div>

            <div class="alert alert-danger py-2" th:if="${param.error}" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i>Usuário ou senha inválidos.
            </div>
            <div class="alert alert-success py-2" th:if="${param.logout}" role="alert">
                <i class="bi bi-check-circle me-1"></i>Sessão encerrada. Até logo!
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label campo-obrigatorio">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username"
                           autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label campo-obrigatorio">Senha</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                </button>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>

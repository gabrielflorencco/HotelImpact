<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout/fragments :: head(${titulo})}"></head>
<body>
<main class="login-pagina">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 380px;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-building-fill fs-2" style="color: var(--hi-accent)" aria-hidden="true"></i>
                    <h1 class="h5 mt-2 mb-0">HotelImpact</h1>
                    <span class="text-secondary small">Gestão hoteleira · Recepção</span>
                </div>

                <div class="hi-alerta alert alert-danger" th:if="${param.error}" role="alert">
                    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i><span>Usuário ou senha inválidos.</span>
                </div>
                <div class="hi-alerta alert alert-success" th:if="${param.logout}" role="status">
                    <i class="bi bi-check-circle" aria-hidden="true"></i><span>Sessão encerrada. Até logo!</span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label campo-obrigatorio">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username"
                               autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label campo-obrigatorio">Senha</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>

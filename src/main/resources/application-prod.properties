# Perfil de produção (Fase 7): ative com SPRING_PROFILES_ACTIVE=prod.
# O esquema vem exclusivamente das migrações Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate

# Sem dados de demonstração e sem caches de template desligados em produção.
spring.thymeleaf.cache=true
app.seed-demo=false

# Actuator para healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-details=when-authorized

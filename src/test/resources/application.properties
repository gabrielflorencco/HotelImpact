spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.thymeleaf.cache=true
app.seed-demo=false

# Nos testes de regra de negócio o esquema continua vindo do Hibernate
# (create-drop); a migração V1 é validada à parte, em MigracaoFlywayTest.
spring.flyway.enabled=false

# Usuário fixo para os testes de autenticação (o padrão gera senha aleatória).
spring.security.user.name=teste
spring.security.user.password=teste123
spring.security.user.roles=RECEPCAO

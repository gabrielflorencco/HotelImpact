spring.application.name=hotelimpact

# Porta: respeita a variável PORT definida pelo provedor de hospedagem (Fase 7).
server.port=${PORT:8080}

# Conexão com PostgreSQL exclusivamente por variáveis de ambiente.
# Os valores padrão apontam para o banco local de desenvolvimento (docker compose).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hotelimpact}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hotelimpact}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hotelimpact_dev}

# Migrações de esquema (Fase 7): V1 é a fotografia do esquema existente.
# Bancos novos executam V1 normalmente; bancos já populados (anteriores ao
# Flyway) recebem baseline na versão 1 e tratam V1 como já aplicada — o
# histórico de dados é preservado. O ddl-auto permanece como rede de
# segurança até a migração ser validada em produção.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA/Hibernate: ddl-auto=update é provisório (desenvolvimento).
# A evolução planejada é migrar para Flyway (ver Fase 7 / README).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Thymeleaf: em produção mantém cache; o DevTools desativa o cache em desenvolvimento.
spring.thymeleaf.cache=true

# Dados de demonstração fictícios: carga idempotente, desligada por padrão.
app.seed-demo=${APP_SEED_DEMO:true}

# Autenticação (Fase 7): acesso restrito a usuários autenticados, com login
# por formulário e CSRF habilitados (padrões do Spring Security). O usuário
# de recepção vem de variáveis de ambiente; o padrão local serve só ao
# desenvolvimento.
spring.security.user.name=${HOTELIMPACT_USER:recepcao}
spring.security.user.password=${HOTELIMPACT_PASSWORD:recepcao-dev}
spring.security.user.roles=RECEPCAO
